# Shared analyzer settings for stock_pulse, market_server and packages/option_math (ADR-0021).
# Each package includes this file after its Flutter/Dart lint set. A package-specific
# exception needs a comment and the architect's approval.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unawaited_futures: error
    discarded_futures: error
    always_use_package_imports: error
    avoid_dynamic_calls: error
    cancel_subscriptions: error
    close_sinks: error

linter:
  rules:
    - always_use_package_imports
    - directives_ordering
    - avoid_dynamic_calls
    - strict_top_level_inference
    - type_annotate_public_apis
    - always_declare_return_types
    - prefer_final_locals
    - prefer_final_fields
    - prefer_const_constructors
    - prefer_const_declarations
    - unnecessary_lambdas
    - unawaited_futures
    - discarded_futures
    - cancel_subscriptions
    - close_sinks
    - avoid_catches_without_on_clauses
    - only_throw_errors
    - no_default_cases
    - avoid_positional_boolean_parameters
    - avoid_redundant_argument_values
    - unnecessary_await_in_return
    - use_super_parameters
    - prefer_single_quotes
    - avoid_print
    - comment_references
    - test_types_in_equals
    - unnecessary_statements
    - use_colored_box
    - use_decorated_box
    - sized_box_shrink_expand
