name: stock_pulse
description: "StockPulse v2: practice trading app (watchlist, F&O, portfolio, AI)."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  intl: ^0.20.3
  path_provider: ^2.1.6
  option_math:
    path: ../packages/option_math
  file_selector: ^1.1.0
  shared_preferences: ^2.5.6
  meta: ^1.19.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  market_server:
    path: ../market_server
  shelf: ^1.4.3

  shared_preferences_platform_interface: any
flutter:

  uses-material-design: true
