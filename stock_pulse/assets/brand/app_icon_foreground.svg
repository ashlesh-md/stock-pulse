<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>StockPulse Android adaptive icon foreground</title>
  <!-- 108 dp layer on a 1024 grid. Safe zone = circle of 66 dp = 626 units, centre (512,512), radius 313.
