<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Team · Mission Control</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo">◆</span>
    <div>
      <div class="eyebrow">Agent team</div>
      <h1 id="project-name">Loading…</h1>
    </div>
  </div>
  <div class="top-mid">
    <div class="progress"><div id="progress-bar"></div></div>
    <div class="progress-meta"><span id="progress-text">0%</span> · <span id="current-phase">-</span></div>
  </div>
  <div class="top-right">
    <div class="sizer" role="group" aria-label="Text size">
      <button type="button" id="zoom-out" title="Smaller text" aria-label="Smaller text">A−</button>
      <span id="zoom-level">100%</span>
      <button type="button" id="zoom-in" title="Larger text" aria-label="Larger text">A+</button>
      <button type="button" id="layout-reset" title="Reset panel sizes" aria-label="Reset panel sizes">↺</button>
    </div>
    <select id="project-select" aria-label="Project"></select>
    <span class="live"><span class="dot" id="live-dot"></span><span id="updated">-</span></span>
  </div>
</header>

<main>
  <section class="panel pipeline-panel">
    <div class="panel-head"><h2>Pipeline</h2><span class="hint">phases and gates, left to right</span></div>
    <ol class="pipeline" id="pipeline"></ol>
  </section>

  <section class="grid top-grid">
    <div class="panel team-panel">
      <div class="panel-head"><h2>Team</h2><span class="hint" id="team-count"></span></div>
      <div id="team" class="scroll"></div>
    </div>
    <div class="gutter col" data-var="--col-team" data-dir="1" title="Drag to resize, double-click to reset"></div>

    <div class="panel board-panel">
      <div class="panel-head"><h2>Work board</h2><span class="hint" id="task-count"></span></div>
      <div class="board scroll" id="board"></div>
    </div>
    <div class="gutter col" data-var="--col-chat" data-dir="-1" title="Drag to resize, double-click to reset"></div>

    <div class="panel chat-panel">
      <div class="panel-head"><h2>Team discussion</h2><span class="hint" id="msg-count"></span></div>
      <div class="threads" id="threads"></div>
      <div class="chat" id="chat"></div>
    </div>
  </section>
  <div class="gutter row" data-var="--h-top" data-dir="1" title="Drag to resize, double-click to reset"></div>

  <section class="grid bottom">
    <div class="panel signoff-panel">
      <div class="panel-head"><h2>Sign-offs</h2></div>
      <div class="signoffs scroll" id="signoffs"></div>
    </div>
    <div class="gutter col" data-var="--col-sign" data-dir="1" title="Drag to resize, double-click to reset"></div>
    <div class="panel docs-panel">
      <div class="panel-head"><h2>Documents</h2><span class="hint">click to read</span></div>
      <ul class="artifacts scroll" id="artifacts"></ul>
    </div>
    <div class="gutter col" data-var="--col-activity" data-dir="-1" title="Drag to resize, double-click to reset"></div>
    <div class="panel activity-panel">
      <div class="panel-head"><h2>Activity</h2></div>
      <ul class="timeline scroll" id="timeline"></ul>
    </div>
  </section>
  <div class="gutter row" data-var="--h-bottom" data-dir="1" title="Drag to resize, double-click to reset"></div>
</main>

<dialog id="viewer">
  <div class="viewer-head">
    <span id="viewer-title"></span>
    <button id="viewer-close" aria-label="Close">✕</button>
  </div>
  <article id="viewer-body" class="md"></article>
</dialog>

<script src="layout.js"></script>
<script src="app.js"></script>
</body>
</html>
